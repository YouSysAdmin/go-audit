name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with: { version: '3.x' }

      # Install only, so CI runs the same `task check` as a developer.
      # The pin moves with the Go version, an older linter cannot read newer export data.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      # gofmt, vet, golangci-lint and race tests
      - run: task check

      - run: task build

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with: { version: '3.x' }

      - run: task vulncheck
