# The default linter set (errcheck, govet, ineffassign, staticcheck, unused)
# plus linters that were clean when added, so they only fire on a regression.
version: "2"

linters:
  default: standard

  enable:
    - modernize
    - errorlint
    - errname
    - copyloopvar
    - intrange
    - perfsprint
    - usestdlibvars
    - unconvert
    - wastedassign
    - durationcheck
    - bodyclose
    - misspell
    - nolintlint
    - gocritic
    - revive

  settings:
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
